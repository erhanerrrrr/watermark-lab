version: 1
updated_at: "2026-09-05"

project:
  name: Watermark Lab
  subtitle: 面向复合攻击与局部篡改的数字图像水印实验平台
  stage: M6

models:
  lsb_reference:
    display_name: LSB Reference
    family: 空间域自检
    description: 最低复杂度的端到端管线自检模型，不参与 formal-v1 正式排名。
    detail: 逐像素最低有效位嵌入；速度快，但对压缩和编辑攻击不鲁棒。
    robustness: 低
    default_strength: 2.0
    accent: "#64748b"
  dwt_dct:
    display_name: DWT-DCT
    family: 传统频域
    description: 小波变换结合离散余弦变换的可解释传统基线。
    detail: 在 DWT 低频子带的 DCT 中频系数中盲嵌入 32 bit 消息。
    robustness: 中
    default_strength: 60.0
    accent: "#0ea5e9"
  trustmark_q:
    display_name: TrustMark-Q
    family: 深度学习
    description: Adobe TrustMark Q 变体，全局深度水印对比基线。
    detail: 使用 BCH-5 纠错编码；官方运行时与权重在独立环境中加载。
    robustness: 高
    default_strength: 1.0
    accent: "#8b5cf6"
  wam:
    display_name: WAM
    family: 前沿模型
    description: Watermark Anything 官方 MIT 模型，支持空间检测与盲解码。
    detail: 使用固定官方提交与权重，作为 AM-WAM 的核心前沿对比方法。
    robustness: 很高
    default_strength: 2.0
    accent: "#10b981"
  am_wam:
    display_name: AM-WAM
    family: 本项目改进
    description: 加入盲几何同步与内容自适应强度控制的 WAM 改进方案。
    detail: 显著改善旋转和透视攻击，但强模糊与额外解码耗时仍是明确边界。
    robustness: 很高
    default_strength: 2.0
    accent: "#f59e0b"
  budget_wam:
    display_name: Budget-WAM
    family: 本项目新方法
    description: 依据解码证据按需执行几何校正，设置候选上限并支持提前停止。
    detail: geometry-v3 单独验证；沿用质量反馈嵌入，策略仅在校准集选择。
    robustness: 几何同步
    default_strength: 2.0
    accent: "#0f766e"

