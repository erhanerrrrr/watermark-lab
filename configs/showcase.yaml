interactive_attacks:
  - id: none
    display_name: 无攻击
    description: 只验证嵌入与盲提取闭环。
    parameter_label: 无参数
    minimum: 0
    maximum: 0
    step: 1
    default: 0
    unit: ""
  - id: jpeg
    display_name: JPEG 压缩
    description: 以指定质量因子重新编码图像。
    parameter_label: JPEG 质量
    minimum: 1
    maximum: 100
    step: 1
    default: 80
    unit: Q
  - id: noise
    display_name: 高斯噪声
    description: 叠加零均值高斯噪声。
    parameter_label: 标准差
    minimum: 0
    maximum: 0.2
    step: 0.005
    default: 0.01
    unit: σ
  - id: crop
    display_name: 裁剪后缩放
    description: 保留中心区域后缩放回原尺寸。
    parameter_label: 保留比例
    minimum: 0.1
    maximum: 1
    step: 0.05
    default: 0.75
    unit: ×
  - id: resize
    display_name: 缩放往返
    description: 缩放到指定倍率后恢复原尺寸。
    parameter_label: 缩放倍率
    minimum: 0.1
    maximum: 2
    step: 0.05
    default: 0.75
    unit: ×
  - id: rotate
    display_name: 旋转 · 中值填充
    description: 旋转图像并保持原始画布尺寸，空白处以中值颜色填充。
    parameter_label: 旋转角度
    minimum: -30
    maximum: 30
    step: 0.1
    default: 10
    unit: °
  - id: rotate_black
    display_name: 旋转 · 黑色填充
    description: 用黑色填充旋转后的边缘，检查几何同步对填充颜色的依赖。
    parameter_label: 旋转角度
    minimum: -30
    maximum: 30
    step: 0.1
    default: 8.3
    unit: °
  - id: rotate_reflect
    display_name: 旋转 · 反射填充
    description: 反射图像边缘后旋转，保持画布尺寸与原图中心。
    parameter_label: 旋转角度
    minimum: -30
    maximum: 30
    step: 0.1
    default: -12.7
    unit: °
  - id: rotate_crop_resize
    display_name: 旋转 · 裁边缩放
    description: 旋转后裁去空白边缘，再缩放回原图尺寸。
    parameter_label: 旋转角度
    minimum: -30
    maximum: 30
    step: 0.1
    default: 8.3
    unit: °
  - id: tamper
    display_name: 局部篡改
    description: 对指定比例的局部区域执行拼接替换。
    parameter_label: 区域比例
    minimum: 0.001
    maximum: 0.9
    step: 0.01
    default: 0.1
    unit: ratio
  - id: compound
    display_name: 组合攻击
    description: 高斯模糊、对比度增强与 JPEG Q80 的固定组合。
    parameter_label: 固定协议
    minimum: 0
    maximum: 0
    step: 1
    default: 0
    unit: ""

